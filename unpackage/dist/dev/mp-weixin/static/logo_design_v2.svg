<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 极光背景 -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF512F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DD2476;stop-opacity:1" />
    </linearGradient>
    
    <!-- 内部阴影，增加质感 -->
    <filter id="inset-shadow">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- 1. 圆角背景 -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#aurora)" />

  <!-- 2. 白色拟态卡片 (日历/记录的隐喻) -->
  <rect x="106" y="106" width="300" height="300" rx="40" ry="40" 
        fill="rgba(255,255,255,0.2)" 
        stroke="rgba(255,255,255,0.4)" 
        stroke-width="2" />

  <!-- 3. 核心图形：时钟与笑脸的结合 -->
  <!-- 3.1 时钟圆环 -->
  <circle cx="256" cy="256" r="100" 
          stroke="white" 
          stroke-width="24" 
          fill="none" 
          stroke-linecap="round" />
  
  <!-- 3.2 分针 (指向右上，代表下班/前进) -->
  <line x1="256" y1="256" x2="316" y2="196" 
        stroke="white" 
        stroke-width="24" 
        stroke-linecap="round" />
        
  <!-- 3.3 时针 (指向正下，稳定) -->
  <line x1="256" y1="256" x2="256" y2="306" 
        stroke="white" 
        stroke-width="24" 
        stroke-linecap="round" />

  <!-- 3.4 俏皮的眼睛 (让时钟看起来像笑脸) -->
  <!-- 左眼 -->
  <circle cx="216" cy="216" r="12" fill="white" /> 
  <!-- 右眼 -->
  <circle cx="296" cy="216" r="12" fill="white" />

  <!-- 4. 装饰元素：右上角的通知红点/小星星 -->
  <circle cx="390" cy="120" r="24" fill="#FFD700" />
</svg>
