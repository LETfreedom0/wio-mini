<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 投影效果 -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="rgba(0,0,0,0.2)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. 背景：柔和的灰白底色，干净简约 -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="#F2F3F5" />

  <!-- 2. 开关底槽 (Toggle Track) -->
  <!-- 颜色：使用充满活力的“下班绿” -->
  <rect x="56" y="136" width="400" height="240" rx="120" ry="120" fill="#34C759" />

  <!-- 3. 左侧暗纹 (WIO) -->
  <text x="120" y="275" font-family="Arial, sans-serif" font-weight="900" font-size="60" fill="white" opacity="0.4" letter-spacing="4">WIO</text>

  <!-- 4. 开关滑块 (圆形按钮) -->
  <!-- 居右，表示 ON 状态 -->
  <circle cx="336" cy="256" r="100" fill="#FFFFFF" filter="url(#dropShadow)" />

  <!-- 5. 表情元素：W 形嘴巴的笑脸 -->
  <!-- 左眼 (弯弯的笑眼) -->
  <path d="M296 240 Q 311 225 326 240" stroke="#333" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- 右眼 (弯弯的笑眼) -->
  <path d="M346 240 Q 361 225 376 240" stroke="#333" stroke-width="8" stroke-linecap="round" fill="none" />
  
  <!-- 嘴巴 (W 形状，代表 WIO) -->
  <path d="M306 270 L 321 285 L 336 270 L 351 285 L 366 270" 
        stroke="#FF3B30" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        fill="none" />
</svg>
